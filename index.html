<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Inter',sans-serif;color:#fff}

/* ── PARTICULES ── */
#particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;border-radius:50%;animation:float linear infinite;opacity:0}
@keyframes float{
  0%{transform:translateY(100vh) scale(0);opacity:0}
  10%{opacity:1}
  90%{opacity:.4}
  100%{transform:translateY(-20px) scale(1.2);opacity:0}
}

/* ── HERO ── */
#hero{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;background:transparent;transition:opacity .7s,transform .7s}
#hero.hidden{opacity:0;pointer-events:none;transform:scale(1.04)}

/* Logo ring animé */
.logo-wrap{position:relative;width:200px;height:200px;margin-bottom:36px}
.logo-ring-outer{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#ff36b0,#a259ff,#00ffe0,#ffb800,#ff36b0);animation:spin 8s linear infinite}
.logo-ring-blur{position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from 0deg,#ff36b0,#a259ff,#00ffe0,#ffb800,#ff36b0);animation:spin 8s linear infinite;filter:blur(14px);opacity:.5}
.logo-ring-mid{position:absolute;inset:4px;border-radius:50%;background:#000;display:flex;align-items:center;justify-content:center}
.logo-ring-inner{width:120px;height:120px;border-radius:50%;background:conic-gradient(from 180deg,#ff36b0 0%,#a259ff 40%,#00ffe0 70%,#ff36b0 100%);display:flex;align-items:center;justify-content:center;animation:spin-rev 12s linear infinite;position:relative}
.logo-ring-inner::after{content:'';position:absolute;inset:6px;border-radius:50%;background:#000}
.logo-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.logo-center-sub{font-size:9px;font-weight:700;letter-spacing:.2em;color:rgba(255,255,255,.35)}
.logo-center-name{font-size:24px;font-weight:900;background:linear-gradient(135deg,#ff36b0,#00ffe0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}

/* Orbites déco */
.orbit{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.06);top:50%;left:50%;transform:translate(-50%,-50%);animation:pulse 4s ease-in-out infinite}
.orbit-1{width:280px;height:280px;animation-delay:0s}
.orbit-2{width:380px;height:380px;animation-delay:.8s;border-color:rgba(162,89,255,.08)}
.orbit-3{width:480px;height:480px;animation-delay:1.6s;border-color:rgba(0,255,224,.05)}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spin-rev{to{transform:rotate(-360deg)}}

.hero-title{font-size:clamp(54px,9vw,104px);font-weight:900;letter-spacing:-.03em;line-height:.9;text-align:center;margin-bottom:12px}
.hero-title em{font-style:normal;background:linear-gradient(135deg,#ff36b0 0%,#a259ff 50%,#00ffe0 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:12px;color:rgba(255,255,255,.28);letter-spacing:.28em;text-transform:uppercase;margin-bottom:54px}
.hero-cta{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.18);color:#fff;padding:15px 38px;border-radius:40px;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.08em;transition:all .2s;position:relative;overflow:hidden}
.hero-cta::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,54,176,.15),rgba(0,255,224,.1));opacity:0;transition:opacity .3s}
.hero-cta:hover::before{opacity:1}
.hero-cta:hover{border-color:rgba(255,255,255,.35)}

/* ── GLITCH LINE ── */
.glitch-line{position:fixed;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,54,176,.4),rgba(0,255,224,.4),transparent);z-index:5;pointer-events:none;animation:glitch-move 6s ease-in-out infinite}
.glitch-line:nth-child(2){animation-delay:3s;background:linear-gradient(90deg,transparent,rgba(162,89,255,.3),transparent)}
@keyframes glitch-move{0%{top:-2px;opacity:0}20%{opacity:1}50%{top:100vh;opacity:.5}51%{top:-2px;opacity:0}100%{top:-2px;opacity:0}}

/* ── BG ── */
#bg{position:fixed;inset:0;z-index:0;transition:background 1s}

/* ── CORNER DECOS ── */
.corner-deco{position:fixed;z-index:2;pointer-events:none;opacity:.4}
.corner-deco svg{display:block}
.corner-tl{top:0;left:0}
.corner-tr{top:0;right:0;transform:scaleX(-1)}
.corner-bl{bottom:0;left:0;transform:scaleY(-1)}
.corner-br{bottom:0;right:0;transform:scale(-1)}

/* ── SCENE ── */
#scene{position:fixed;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .6s}
#scene.visible{opacity:1;pointer-events:all}
#track{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}

.slide{
  position:absolute;
  width:min(560px,56vw);
  max-height:82vh;
  border-radius:22px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.07);
  background:rgba(6,6,10,.88);
  backdrop-filter:blur(28px);
  transition:transform .55s cubic-bezier(.4,0,.2,1),opacity .55s,box-shadow .55s;
  cursor:pointer;
  will-change:transform,opacity;
}
.slide.active{transform:translateX(0) scale(1);opacity:1;z-index:10;cursor:default;box-shadow:0 0 100px rgba(0,0,0,.9),0 0 40px rgba(0,0,0,.6)}
.slide.prev{transform:translateX(-63%) scale(.71);opacity:.4;z-index:2}
.slide.next{transform:translateX(63%) scale(.71);opacity:.4;z-index:2}
.slide.far-prev{transform:translateX(-98%) scale(.52);opacity:.15;z-index:1}
.slide.far-next{transform:translateX(98%) scale(.52);opacity:.15;z-index:1}
.slide.hidden-slide{opacity:0;pointer-events:none;z-index:0;transform:translateX(0) scale(.4)}

/* Glow derrière la carte active */
.slide-glow{position:absolute;top:50%;left:50%;width:500px;height:500px;border-radius:50%;transform:translate(-50%,-50%);filter:blur(80px);opacity:0;pointer-events:none;z-index:9;transition:opacity .6s,background .6s}
#scene.visible .slide-glow{opacity:.12}

.slide-bar{height:4px;width:100%;flex-shrink:0}
.slide-noise{position:absolute;top:4px;left:0;right:0;height:120px;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px;pointer-events:none}
.slide-body{padding:clamp(20px,3vw,38px);overflow-y:auto;max-height:calc(82vh - 4px)}
.slide-num{font-size:10px;font-weight:700;color:rgba(255,255,255,.16);letter-spacing:.12em;margin-bottom:16px;font-variant-numeric:tabular-nums}
.slide-cat{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px;opacity:.7}
.slide-name{font-size:clamp(26px,3.8vw,46px);font-weight:900;line-height:1;margin-bottom:6px;letter-spacing:-.02em}
.slide-arch{font-size:clamp(12px,1.3vw,14px);color:rgba(255,255,255,.36);margin-bottom:20px;font-weight:300}
.slide-tagline{font-size:clamp(13px,1.5vw,16px);line-height:1.6;color:rgba(255,255,255,.72);margin-bottom:30px;font-style:italic;padding-left:12px;border-left:2px solid rgba(255,255,255,.12)}
.slide-links{display:flex;flex-wrap:wrap;gap:8px}
.slide-link{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:30px;font-size:12px;font-weight:600;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);transition:all .15s;letter-spacing:.04em}
.slide-link:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.26);transform:translateY(-1px)}
.slide-link svg{width:13px;height:13px;flex-shrink:0}
.slide-soon{font-size:12px;color:rgba(255,255,255,.22);font-style:italic}

.side-zone{position:absolute;top:0;bottom:0;width:22%;z-index:20;cursor:pointer}
.side-zone.left{left:0}
.side-zone.right{right:0}

/* ── NAV ── */
#nav{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:12px;opacity:0;transition:opacity .5s;background:rgba(0,0,0,.4);backdrop-filter:blur(16px);padding:8px 16px;border-radius:40px;border:1px solid rgba(255,255,255,.06)}
#nav.visible{opacity:1}
.nav-btn{background:transparent;border:none;color:rgba(255,255,255,.5);width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:16px}
.nav-btn:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav-dots{display:flex;gap:5px;align-items:center}
.dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer;transition:all .25s}
.dot.active{background:#fff;width:18px;border-radius:2px}

/* ── MINI LOGO (carousel) ── */
#mini-logo{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:100;opacity:0;transition:opacity .5s;display:flex;align-items:center;gap:10px}
#mini-logo.visible{opacity:1}
.mini-ring{width:32px;height:32px;border-radius:50%;background:conic-gradient(from 0deg,#ff36b0,#a259ff,#00ffe0,#ff36b0);display:flex;align-items:center;justify-content:center;animation:spin 6s linear infinite}
.mini-ring-in{width:22px;height:22px;border-radius:50%;background:#000;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:900;color:#fff;letter-spacing:.05em}
.mini-title{font-size:12px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.5)}

#back-btn{position:fixed;top:22px;left:22px;z-index:100;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.09);color:rgba(255,255,255,.4);padding:8px 16px;border-radius:30px;font-size:11px;font-weight:600;cursor:pointer;letter-spacing:.06em;display:none;align-items:center;gap:6px;transition:all .2s;backdrop-filter:blur(12px)}
#back-btn.visible{display:flex}
#back-btn:hover{color:#fff;border-color:rgba(255,255,255,.25)}
#counter{position:fixed;top:26px;right:22px;z-index:100;font-size:11px;color:rgba(255,255,255,.18);letter-spacing:.1em;display:none;font-variant-numeric:tabular-nums}
#counter.visible{display:block}

@media(max-width:700px){
  .slide{width:82vw}
  .slide.prev{transform:translateX(-74%) scale(.62);opacity:.28}
  .slide.next{transform:translateX(74%) scale(.62);opacity:.28}
  .slide.far-prev,.slide.far-next{opacity:0}
  .orbit-2,.orbit-3{display:none}
}
</style>
</head>
<body>

<!-- CORNER DECOS -->

<!-- HERO -->

</div>

<script>
const CH=[
  {name:"The Weasel",cat:"Musique · Archive",arch:"L'explorateur du bruit",tag:"Tout essayer. Rien jeter. L'époque où tout était possible.",accent:"#F2E500",rgb:"242,229,0",links:[{l:"YouTube",u:"https://www.youtube.com/@theweasel-officielonline",i:"yt"}]},
  {name:"Rg2S",cat:"Musique · Archive",arch:"Le DJ de teuf",tag:"Les armes choisies, les heures de mix, l'éclate pure.",accent:"#FF6B00",rgb:"255,107,0",links:[{l:"YouTube",u:"https://www.youtube.com/@rg2s-officielonline",i:"yt"}]},
  {name:"Tek Le Lorrain",cat:"Musique",arch:"L'artisan en série",tag:"Un cadre, une essence, une série. La rigueur du plaisir.",accent:"#D4C9B0",rgb:"212,201,176",links:[{l:"YouTube",u:"https://www.youtube.com/@teklelorrain-officielonline",i:"yt"}]},
  {name:"Rex Vindex",cat:"Musique IA",arch:"L'expérience IA",tag:"Un album né de la curiosité. Sombre, industriel, inattendu.",accent:"#CC0000",rgb:"204,0,0",links:[{l:"YouTube",u:"https://www.youtube.com/@REXVINDEX",i:"yt"},{l:"Facebook",u:"https://www.facebook.com/profile.php?id=61593574276201",i:"fb"}]},
  {name:"Rapacash",cat:"Musique IA",arch:"Le rappeur fictif",tag:"Il ne pense qu'à la tune. Un délire à creuser.",accent:"#D4AF37",rgb:"212,175,55",links:[{l:"YouTube",u:"https://www.youtube.com/@Rapacash",i:"yt"}]},
  {name:"Zen Lofi Vibes",cat:"Musique IA",arch:"L'expérience qui cherche sa forme",tag:"IA, sons longs, ambiance. La recette n'est pas encore trouvée.",accent:"#5B7FD4",rgb:"91,127,212",links:[{l:"YouTube",u:"https://www.youtube.com/@Zenlofivibesonline",i:"yt"}]},
  {name:"OXYD",cat:"Communauté",arch:"Le bébé de la bande",tag:"LE Forum de la musique éléctronique. Depuis 2005.",accent:"#00A651",rgb:"0,166,81",links:[{l:"YouTube",u:"https://www.youtube.com/@OXYDonline",i:"yt"},{l:"Forum",u:"http://oxyd.forum-actif.net/",i:"forum"},{l:"Facebook",u:"https://www.facebook.com/Oxyd.fr.nf/",i:"fb"}]},
  {name:"Le Poing",cat:"Média · Satire",arch:"Média satirique et humoristique sur l'actu",tag:"Actualité, enquête, débat — jusqu'à ce que ça devienne absurde.",accent:"#E24B4A",rgb:"226,75,74",links:[{l:"Facebook",u:"https://www.facebook.com/profile.php?id=61593502453793",i:"fb"}]},
  {name:"Vil'Brekin",cat:"Gaming",arch:"Le flambeur du flipper. Chaine sur le gaming arcade sur Iphone.",tag:"Chaque partie tient en 15 secondes. Chaque score se joue à l'instinct.",accent:"#4CD3FF",rgb:"76,211,255",links:[{l:"YouTube",u:"https://www.youtube.com/@vilbrekin",i:"yt"}]},
  {name:"Les Plantes qui Guérissent",cat:"Savoir · Nature",arch:"L'herboriste de chemin",tag:"Des recettes de bobologie trouvées au bord du chemin.",accent:"#4A7C59",rgb:"74,124,89",links:[{l:"YouTube",u:"https://www.youtube.com/@lesplantesquiguerissentonline",i:"yt"}]},
  {name:"L'Écho de Labra",cat:"Savoir · Nature",arch:"Le chuchoteur des pierres",tag:"Le pouvoir des pierres, doucement.",accent:"#9B59B6",rgb:"155,89,182",links:[{l:"YouTube",u:"https://www.youtube.com/@EchoDeLabra",i:"yt"}]},
  {name:"La Minute Dictons",cat:"Culture · Langue",arch:"Le conteur pressé",tag:"Un dicton, une signification, une minute — avec le sourire.",accent:"#4A90D9",rgb:"74,144,217",links:[{l:"YouTube",u:"https://www.youtube.com/@StudioREG-LaMinuteDicton/shorts",i:"yt"},{l:"Facebook",u:"https://www.facebook.com/profile.php?id=61567490648009",i:"fb"}]},
  {name:"Murmure Imaginaire",cat:"Fiction · Narration",arch:"La voix dans le noir",tag:"Des histoires lues au micro. Des images qui respirent.",accent:"#8E9EAB",rgb:"142,158,171",links:[{l:"YouTube",u:"https://www.youtube.com/@murmureimaginaireonline",i:"yt"}]},
  {name:"ERROR CLUB 404",cat:"ARG",arch:"L'architecte du chaos",tag:"Un monde dystopique, des indices cachés. Fouille.",accent:"#00FF41",rgb:"0,255,65",links:[{l:"YouTube",u:"https://www.youtube.com/@ErrorClub404",i:"yt"}]},
  {name:"Back to 1960",cat:"Projet personnel",arch:"La mémoire du père",tag:"Une année. Une page. Depuis 1960, pour lui.",accent:"#C4956A",rgb:"196,149,106",links:[https://sites.google.com/view/backto1960/accueil]},
  {name:"Studio REG",cat:"Hub · Label",arch:"L'univers entier",tag:"Musique, gaming, satire, nature, fiction, ARG — un seul label, toutes les directions.",accent:"#ff36b0",rgb:"255,54,176",links:[{l:"Facebook",u:"https://www.facebook.com/studioregonline/",i:"fb"}]}
];

const N=CH.length;
const YT=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 7s-.3-2-1.2-2.7c-1.1-1.2-2.4-1.2-3-1.3C16.2 3 12 3 12 3s-4.2 0-6.8.2c-.6 0-1.9.1-3 1.3C1.3 5 1 7 1 7S.7 9.1.7 11.3v2c0 2.1.3 4.3.3 4.3s.3 2 1.2 2.7c1.1 1.2 2.6 1.1 3.3 1.2C7.2 21.7 12 22 12 22s4.2 0 6.8-.3c.6 0 1.9-.1 3-1.3.9-.7 1.2-2.7 1.2-2.7s.3-2.1.3-4.3v-2C23.3 9.1 23 7 23 7zM9.7 15.5V8.4l8.1 3.6-8.1 3.5z"/></svg>`;
const FB=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.1C24 5.4 18.6 0 12 0S0 5.4 0 12.1c0 6 4.4 11 10.1 11.9v-8.4H7.1v-3.5h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9v2.3h3.3l-.5 3.5h-2.8v8.4C19.6 23.1 24 18.1 24 12.1z"/></svg>`;
const FORUM=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;
const ICONS={yt:YT,fb:FB,forum:FORUM};

let cur=0;
let startX=0;
let dragging=false;

// Boucle infinie : on clone les slides en triplet (prev-copy, original, next-copy)
// On gère l'index virtuel mod N
function mod(i,n){return((i%n)+n)%n}

function buildSlides(){
  const track=document.getElementById('track');
  const dotsEl=document.getElementById('dots');
  // Créer N slides (on positionne via classes selon diff avec cur)
  CH.forEach((ch,i)=>{
    const el=document.createElement('div');
    el.className='slide hidden-slide';
    el.dataset.idx=i;
    el.innerHTML=`
      <div class="slide-bar" style="background:${ch.accent}"></div>
      <div class="slide-noise"></div>
      <div class="slide-body">
        <div class="slide-num">${String(i+1).padStart(2,'0')} — ${String(N).padStart(2,'0')}</div>
        <p class="slide-cat" style="color:${ch.accent}">${ch.cat}</p>
        <h2 class="slide-name">${ch.name}</h2>
        <p class="slide-arch">${ch.arch}</p>
        <p class="slide-tagline" style="border-left-color:${ch.accent}44">${ch.tag}</p>
        <div class="slide-links">
          ${ch.links.map(lk=>`<a class="slide-link" href="${lk.u}" target="_blank" rel="noopener">${ICONS[lk.i]}${lk.l}</a>`).join('')}
          ${ch.links.length===0?'<span class="slide-soon">Bientôt en ligne</span>':''}
        </div>
      </div>`;
    track.appendChild(el);
    const d=document.createElement('div');
    d.className='dot';
    d.onclick=()=>goTo(i);
    dotsEl.appendChild(d);
  });
}

function getSlides(){return document.querySelectorAll('.slide')}

function updateView(){
  const slides=getSlides();
  slides.forEach(sl=>{
    const i=parseInt(sl.dataset.idx);
    // diff circulaire
    let diff=i-cur;
    // wrap : si diff > N/2, aller dans l'autre sens
    if(diff>N/2) diff-=N;
    if(diff<-N/2) diff+=N;
    sl.className='slide';
    if(diff===0){sl.classList.add('active');sl.style.cursor='default'}
    else if(diff===-1){sl.classList.add('prev');sl.style.cursor='pointer';sl.onclick=()=>move(-1)}
    else if(diff===1){sl.classList.add('next');sl.style.cursor='pointer';sl.onclick=()=>move(1)}
    else if(diff===-2){sl.classList.add('far-prev');sl.style.cursor='pointer';sl.onclick=()=>move(-1)}
    else if(diff===2){sl.classList.add('far-next');sl.style.cursor='pointer';sl.onclick=()=>move(1)}
    else{sl.classList.add('hidden-slide');sl.onclick=null}
  });
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
  const ch=CH[cur];
  document.getElementById('bg').style.background=`radial-gradient(ellipse at 40% 50%, rgba(${ch.rgb},.1) 0%, #000 55%)`;
  document.getElementById('slide-glow').style.background=`radial-gradient(circle, rgba(${ch.rgb},.5) 0%, transparent 70%)`;
  document.getElementById('counter').textContent=`${cur+1} / ${N}`;
}

function move(d){goTo(mod(cur+d,N))}
function goTo(i){cur=i;updateView()}

function enterCarousel(){
  document.getElementById('hero').classList.add('hidden');
  document.getElementById('scene').classList.add('visible');
  document.getElementById('nav').classList.add('visible');
  document.getElementById('back-btn').classList.add('visible');
  document.getElementById('mini-logo').classList.add('visible');
  document.getElementById('counter').classList.add('visible');
  updateView();
}
function exitCarousel(){
  document.getElementById('hero').classList.remove('hidden');
  document.getElementById('scene').classList.remove('visible');
  document.getElementById('nav').classList.remove('visible');
  document.getElementById('back-btn').classList.remove('visible');
  document.getElementById('mini-logo').classList.remove('visible');
  document.getElementById('counter').classList.remove('visible');
}

// Touch / drag
const scene=document.getElementById('scene');
scene.addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});
scene.addEventListener('touchend',e=>{const d=startX-e.changedTouches[0].clientX;if(Math.abs(d)>55)move(d>0?1:-1)});
scene.addEventListener('mousedown',e=>{dragging=true;startX=e.clientX});
document.addEventListener('mouseup',e=>{if(!dragging)return;dragging=false;const d=startX-e.clientX;if(Math.abs(d)>55)move(d>0?1:-1)});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.key==='Escape')exitCarousel()});

// Particules
(function(){
  const colors=['#ff36b0','#a259ff','#00ffe0','#ffb800','#ff36b0'];
  const wrap=document.getElementById('particles');
  for(let i=0;i<22;i++){
    const p=document.createElement('div');
    p.className='particle';
    const size=Math.random()*3+1;
    p.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${8+Math.random()*12}s;animation-delay:${Math.random()*10}s`;
    wrap.appendChild(p);
  }
})();
